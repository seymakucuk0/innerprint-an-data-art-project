name: Deploy art to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: art
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: art/package-lock.json

      - run: npm ci

      - run: npm run build
        env:
          # Spotify Client IDs are public by design (PKCE flow protects the
          # actual auth). Hardcoding here avoids needing GH secrets.
          VITE_SPOTIFY_CLIENT_ID: 3f56981bdd2142bdb9fe23e31affac2d

      - uses: actions/upload-pages-artifact@v3
        with:
          path: art/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
